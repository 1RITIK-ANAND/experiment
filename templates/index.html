<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Insurance Cost Prediction</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      background: #111;
      border-radius: 12px;
      padding: 30px 40px;
      box-shadow: 0 0 15px #ffdf00;
      max-width: 600px;
      width: 90%;
    }
    h1 {
      text-align: center;
      color: #ffdf00;
    }
    .logo {
      width: 60px;
      margin: 0 auto 10px;
      display: block;
    }
    label {
      display: block;
      margin: 12px 0 6px;
      font-weight: bold;
    }
    input, select {
      width: 100%;
      padding: 10px;
      font-size: 1rem;
      border-radius: 5px;
      border: none;
      outline: none;
      margin-bottom: 12px;
    }
    input[type="submit"], button {
      background-color: #ffdf00;
      color: #000;
      font-weight: bold;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease-in-out;
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
    }
    input[type="submit"]:hover, button:hover {
      background-color: #ffd700;
      transform: scale(1.03);
    }
    .result {
      text-align: center;
      margin-top: 20px;
      font-size: 1.2rem;
      color: #ffdf00;
    }
    .footer-text {
      margin-top: 20px;
      font-size: 0.95rem;
      color: #ccc;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <img class="logo" src="C:\Users\ritik\Desktop\PROJEC\HEALTH_INSURANCE\doc.jpg" alt="Health Logo">
    <h1>Insurance Cost Prediction</h1>

    <form action="/predict" method="POST">
      <label>Age</label>
      <input type="number" name="age" required>

      <label>Sex</label>
      <select name="sex" required>
        <option value="0">Male</option>
        <option value="1">Female</option>
      </select>

      <label>BMI</label>
      <input type="number" name="bmi" step="0.1" required>

      <label>Children</label>
      <input type="number" name="children" required>

      <label>Smoker</label>
      <select name="smoker" required>
        <option value="1">Yes</option>
        <option value="0">No</option>
      </select>

      <label>Region</label>
      <select name="region" required>
        <option value="0">Southeast</option>
        <option value="1">Southwest</option>
        <option value="2">Northeast</option>
        <option value="3">Northwest</option>
      </select>

      <input type="submit" value="Predict">
    </form>

    {% if prediction_text %}
      <div class="result">{{ prediction_text }}</div>
    {% endif %}

    <div class="footer-text">
      <p>Want to predict insurance cost for large datasets?</p>
      <p>You can upload a CSV file with the same features arranged in order.</p>
      <form action="/predict_csv" method="POST" enctype="multipart/form-data">
        <input type="file" name="file" required>
        <button type="submit">Upload & Predict</button>
      </form>
    </div>
  </div>
</body>
</html>
