<!DOCTYPE html>
<html>
<head>
    <title>Health Insurance Cost Prediction</title>
</head>
<body>
    <h2>Enter Details</h2>
    <form action="/predict" method="post">
        Age: <input type="text" name="age"><br>
        Sex (0=Male, 1=Female): <input type="text" name="sex"><br>
        BMI: <input type="text" name="bmi"><br>
        Children: <input type="text" name="children"><br>
        Smoker (0=Yes, 1=No): <input type="text" name="smoker"><br>
        Region (0=southeast, 1=southwest, 2=northeast, 3=northwest): <input type="text" name="region"><br>
        <input type="submit" value="Predict">
    </form>
    <h3>{{ prediction_text }}</h3>
</body>
</html>
